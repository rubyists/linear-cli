---
name: Build and publish release artifacts

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to attach binaries to
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to attach binaries to
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  burrito:
    name: Build Burrito binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      -
        uses: actions/checkout@v7
      -
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.3"
          elixir-version: "1.20.3"
          # Without this, setup-beam's problem matchers promote every
          # compiler warning from deps (e.g. postgrex/rewrite's deprecated
          # `xref: [exclude: ...]`, yamerl's deprecated `catch ...` syntax -
          # both already at their latest published Hex versions, so not
          # fixable from here) into noisy GH Actions annotations. See #9.
          disable_problem_matchers: true
      -
        # Version pinned to what Burrito 1.6.0 actually requires - its own
        # README says 0.15.2, but the version check enforces 0.16.0. See
        # documents/phase-8-plan.adoc.
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.16.0"
      -
        name: Install p7zip (Burrito needs 7z for Windows targets)
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      -
        run: mix deps.get
      -
        name: Build all Burrito targets
        run: MIX_ENV=prod mix release lc
      -
        # `mix release lc`'s exit code alone doesn't guarantee every target
        # actually produced a binary - Burrito builds each target
        # independently, so one target failing partway through wouldn't
        # necessarily fail the whole `mix release` invocation. Not everyone
        # installing this uses Homebrew (no tap exists yet anyway - see
        # #14/CRY-37), so these binaries are the primary install path for
        # a lot of users; silently shipping a release missing one of them
        # is worse than failing loudly here.
        name: Verify the required targets actually built
        run: |
          missing=0
          for target in lc_linux_x86_64 lc_macos_aarch64
          do
              if [ ! -f "burrito_out/$target" ]
              then
                  printf '::error::missing required release artifact: %s\n' "$target"
                  missing=1
              fi
          done
          [ "$missing" -eq 0 ]
      -
        # A bare `lc_macos_aarch64` binary download doesn't get you
        # lcreate/lcls/lclose/lcomment/lproj - only install.sh and the
        # container image ever pulled those, straight from the repo
        # checkout, never from a release asset. Package each target
        # together with the wrapper scripts so a release download is
        # actually installable on its own, matching what install.sh gives
        # you.
        name: Package each target into a per-platform tarball with the wrapper scripts
        run: |
          for artifact in lc_*
          do
              case "$artifact" in
                  lc_windows_x86_64.exe)
                      target=lc_windows_x86_64
                      binary_name=lc.exe
                      ;;
                  *)
                      target=$artifact
                      binary_name=lc
                      ;;
              esac

              stage=$(mktemp -d)
              cp "$artifact" "$stage/$binary_name"
              cp ../../bin/lcreate ../../bin/lcls ../../bin/lclose ../../bin/lcomment ../../bin/lproj "$stage/"
              chmod +x "$stage"/*
              tar -czf "${target}.tar.gz" -C "$stage" .
              rm -rf "$stage" "$artifact"
          done
        working-directory: app/burrito_out
      -
        name: Generate checksums for every built artifact
        run: sha256sum * > SHA256SUMS
        working-directory: app/burrito_out
      -
        name: Upload release tarballs and checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag_name }}" app/burrito_out/* --clobber
        working-directory: .
      -
        # release-please creates this as a draft (see
        # .release-please-config.json) specifically so assets can still be
        # attached above - GitHub's Immutable Releases (GA since Oct 2025)
        # locks a *published* release's assets the moment it's created, and
        # this build takes ~10 minutes, well past that point. Publish only
        # now that every asset has actually landed.
        name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.tag_name }}" --draft=false
        working-directory: .

  container:
    name: Build and publish container image
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v7
      -
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.3"
          elixir-version: "1.20.3"
          # Without this, setup-beam's problem matchers promote every
          # compiler warning from deps (e.g. postgrex/rewrite's deprecated
          # `xref: [exclude: ...]`, yamerl's deprecated `catch ...` syntax -
          # both already at their latest published Hex versions, so not
          # fixable from here) into noisy GH Actions annotations. See #9.
          disable_problem_matchers: true
      -
        # Same Burrito build as the `burrito` job above, so it needs the same
        # pinned Zig (see that job's comment) - missing here would fail this
        # job's build at `mix release` time even though `burrito` succeeds.
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.16.0"
      -
        run: mix deps.get
        working-directory: app
      -
        name: Build the linux_x86_64 target (container's payload)
        run: MIX_ENV=prod BURRITO_TARGET=linux_x86_64 mix release lc
        working-directory: app
      -
        name: Build the image
        env:
          APP_VERSION: ${{ inputs.tag_name }}
        run: ./ci/build_image.sh "${{ inputs.tag_name }}"
      -
        name: Publish the image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./ci/publish.sh "${{ inputs.tag_name }}"
